<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JawsAtak47 — QuarkForce</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --bg:#040810;
    --bg-panel:#0d1728;
    --line:#16243d;
    --ink:#e6f0ff;
    --dim:#6b82a6;
    --red:#ff2a4b;
    --red-dim:#801020;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    background-image:
      linear-gradient(rgba(255, 42, 75, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 42, 75, 0.04) 1px, transparent 1px);
    background-size: 42px 42px;
    color:var(--ink);
    font-family:'Space Mono', monospace;
    padding:0 0 80px;
  }

  header{
    padding:56px 24px 40px;
    text-align:center;
    position:relative;
  }

  .masthead{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:clamp(2.6rem, 9vw, 5.2rem);
    line-height:0.9;
    letter-spacing:1px;
    display:inline-block;
    color:var(--red);
    text-shadow:0 0 18px rgba(255, 42, 75, 0.35);
  }

  .tagline{
    margin-top:20px;
    font-size:0.9rem;
    color:var(--dim);
    letter-spacing:0.02em;
    max-width:480px;
    margin-left:auto;
    margin-right:auto;
    line-height:1.6;
  }

  .count-strip{
    margin-top:20px;
    display:inline-block;
    border:1px solid var(--red-dim);
    color:var(--red);
    padding:6px 16px;
    font-size:0.75rem;
    letter-spacing:0.08em;
  }

  main{
    max-width:1200px;
    margin:0 auto;
    padding:0 24px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:34px 28px;
  }

  .clip-card{
    position:relative;
    background:var(--bg-panel);
    padding:12px 12px 16px;
    border:1px solid var(--line);
    transition:border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .clip-card:hover{
    border-color:var(--red);
    box-shadow:0 0 15px rgba(255, 42, 75, 0.15);
  }

  .thumb-button{
    display:block;
    width:100%;
    position:relative;
    overflow:hidden;
    border:1px solid var(--line);
    aspect-ratio:16/9;
    background:#080e1a;
    padding:0;
    cursor:pointer;
  }

  .thumb-button img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:grayscale(0.2) contrast(1.05);
    transition:filter 0.3s ease;
  }

  .thumb-button:hover img{
    filter:grayscale(0) contrast(1.1);
  }

  .thumb-button::after{
    content:"PLAY VIDEO ▶";
    position:absolute;
    inset:auto 0 0 0;
    background:var(--red);
    color:#040810;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:0.7rem;
    letter-spacing:0.04em;
    text-align:center;
    padding:8px 0;
    transform:translateY(100%);
    transition:transform 0.2s ease;
  }

  .thumb-button:hover::after{
    transform:translateY(0);
  }

  .clip-meta{
    padding-top:14px;
  }

  .clip-num{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:1.1rem;
    color:var(--red);
    line-height:1;
  }

  .clip-title{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:1.25rem;
    margin:4px 0 8px;
    line-height:1.1;
    color:var(--ink);
  }

  .clip-blurb{
    font-size:0.8rem;
    line-height:1.55;
    color:var(--dim);
  }

  /* Video Modal Window */
  .modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(4, 8, 16, 0.92);
    backdrop-filter:blur(6px);
    align-items:center;
    justify-content:center;
    padding:20px;
  }

  .modal.active{
    display:flex;
  }

  .modal-content{
    position:relative;
    width:100%;
    max-width:900px;
    background:var(--bg-panel);
    border:1px solid var(--red);
    padding:16px;
    box-shadow:0 0 35px rgba(255, 42, 75, 0.25);
  }

  .video-container{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
  }

  .video-container iframe{
    width:100%;
    height:100%;
    border:none;
  }

  .close-btn{
    position:absolute;
    top:-40px;
    right:0;
    background:transparent;
    border:1px solid var(--red);
    color:var(--red);
    font-family:'Space Mono', monospace;
    font-size:0.8rem;
    padding:6px 12px;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease;
  }

  .close-btn:hover{
    background:var(--red);
    color:var(--bg);
  }

  footer{
    max-width:1200px;
    margin:60px auto 0;
    padding:0 24px;
    font-size:0.75rem;
    color:var(--dim);
    border-top:1px solid var(--line);
    padding-top:18px;
  }

  @media (prefers-reduced-motion: reduce){
    .thumb-button img, .thumb-button::after{ transition:none; }
  }
</style>
</head>
<body>

<header>
  <div class="masthead">JawsAtakTV</div>
  <p class="tagline">Video archives, field footage, and visual dispatches from the QuarkUniverse.</p>
  <div class="count-strip" id="clip-count">0 CLIPS ARCHIVED</div>
</header>

<main>
  <div class="grid" id="clip-grid"></div>
</main>

<div class="modal" id="video-modal">
  <div class="modal-content">
    <button class="close-btn" id="close-modal">CLOSE [X]</button>
    <div class="video-container">
      <iframe id="video-player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>
</div>

<footer>
  QuarkForce © <span id="year"></span> — new footage added as it renders.
</footer>

<script>
  // ---------------------------------------------------------------
  // EDIT THIS LIST to add or update your video clips.
  // ---------------------------------------------------------------
  const CLIPS = [
    { 
      thumbnail: "CanvasWars June2026.png", 
      title: "CanvasWars June2026", 
      blurb: "Complete event from prep to prize delivery!", 
      link: "https://youtu.be/v8CcaCUMK5k?si=NLBhqqXmu7aV3IaQ" 
    },
    { 
      thumbnail: "Art for CanvasWars MonsTober.png", 
      title: "Art for CanvasWars MonsTober", 
      blurb: "Phoenix Phoodery October 3 2026.", 
      link: "https://youtu.be/vdR-tQ_SYzw?si=EwOhN1vKO0ShpccM" 
    },
    { 
      thumbnail: "Masters of the Way -Wisdom.png", 
      title: "Masters of the Way -Wisdom", 
      blurb: "Wisdom to meditate to.", 
      link: "https://youtu.be/jVqm59BEenI?si=uxoI2orYQDKJmoVy" 
    }
  ];

  const grid = document.getElementById("clip-grid");
  const countStrip = document.getElementById("clip-count");
  const modal = document.getElementById("video-modal");
  const player = document.getElementById("video-player");
  const closeBtn = document.getElementById("close-modal");

  // Update counter display
  countStrip.textContent = `${CLIPS.length} CLIPS ARCHIVED`;

  // Convert standard YouTube links to embed links for the popup window
  function getEmbedUrl(url) {
    if (url.includes("youtu.be/")) {
      const id = url.split("youtu.be/")[1].split("?")[0];
      return `https://www.youtube.com/embed/${id}?autoplay=1`;
    } else if (url.includes("watch?v=")) {
      const id = url.split("watch?v=")[1].split("&")[0];
      return `https://www.youtube.com/embed/${id}?autoplay=1`;
    }
    return url;
  }

  CLIPS.forEach((clip, i) => {
    const num = String(i + 1).padStart(2, "0");
    const card = document.createElement("div");
    card.className = "clip-card";
    card.innerHTML = `
      <button class="thumb-button" onclick="openVideo('${clip.link}')">
        <img src="${clip.thumbnail}" alt="Thumbnail for ${clip.title}" loading="lazy">
      </button>
      <div class="clip-meta">
        <div class="clip-num">CLIP NO. ${num}</div>
        <div class="clip-title">${clip.title}</div>
        <div class="clip-blurb">${clip.blurb}</div>
      </div>
    `;
    grid.appendChild(card);
  });

  function openVideo(url) {
    const embedUrl = getEmbedUrl(url);
    player.src = embedUrl;
    modal.classList.add("active");
  }

  function closeVideo() {
    modal.classList.remove("active");
    player.src = "";
  }

  closeBtn.addEventListener("click", closeVideo);
  
  // Close modal when clicking outside content area
  modal.addEventListener("click", (e) => {
    if (e.target === modal) closeVideo();
  });

  // Close modal with Escape key
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.classList.contains("active")) {
      closeVideo();
    }
  });

  document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
